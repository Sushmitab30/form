<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <fieldset>
        <legend>Basic Inputs</legend>
        <label for="un">Text:</label>
        <input id="un" type="text">
    
        <br><br>
        <label for="Password">Password:</label>
        <input id="Password" type="password">

        <br><br>
        <label for="email">Email:</label>
        <input id="email" type="email">

        <br><br>
        <label for="number">Number:</label>
        <input id="number" type="tel">

        <br><br>
        <label for="Telephone">Telephone:</label>
        <input id="Telephone" type="tel">

        <br><br>
        <label for="URL">URL:</label>
        <input id="URL" type="url">

        <br><br>
        <label for="Search">Search:</label>
        <input id="Search" type="search">
    </fieldset>

    <hr>

    <fieldset>
        <legend>Date and Time</legend>
        <label for="date">Date:</label>
        <input id="date" type="date">

        <br><br>
        <label for="time">Time:</label>
        <input id="time" type="time">

        <br><br>
        <label for="datetime-local">Date and Time:</label>
        <input id="datetime-local" type="datetime-local">   

        <br><br>
        <label for="month">Month:</label>
        <input id="month" type="month">

        <br><br>
        <label for="week">Week:</label> 
        <input id="week" type="week">
    </fieldset>

    <hr>

    <fieldset>
        <legend>Selection Controls</legend>
        <label for="Gender">Gender:</label>
        <label></label>
            <input type="checkbox" name="op1" value="Male">Male
        <label>
        <label>
            <input type="checkbox" name="op1" value="Female">Female
        </label>
        <label>
            <input type="checkbox" name="op1" value="Other">Other
        </label>
    </fieldset>

    <hr>

    <fieldset>
     <legend for="Comments">Comments</legend>
        <label for="Address">Address:</label>
        <textarea id="Address" name="Address" rows="4" cols="50"></textarea>
    
    </fieldset>

    <hr>
    <fieldset>
        <legend>Select Options</legend>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="select a country">Select a country</option>
            <option value="india">India</option>
            <option value="usa">United States</option>
            <option value="canada">Canada</option>
            <option value="uk">United Kingdom</option>
        </select>
    </fieldset>

    <hr>
    <fieldset>
        <legend>Datalist example</legend>
        <label for="browser">Choose browser:</label>
        <input list="browsers" name="browser">
        <datalist id="browsers">
            <option value="Chrome">
            <option value="Firefox">
            <option value="Safari">
            <option value="Edge">
        </datalist>
    </fieldset>

    <hr>
    <fieldset>
      <legend>Process & Meter</legend>  
        <label for="range">Process:</label>
        <input id="range" type="range" min="1" max="5" name="rating">
        <br><br>
        <label for="meter">Meter:</label>
        <input id="meter" type="range" min="0" max="100" value="50">
            </fieldset>

            <hr>
            <fieldset>
                <legend>Output example</legend>
                <input id="text" type="text" value="10">+
                <input id="text" type="text" value="20">=30
            </fieldset>
            <hr>
            <fieldset>
                <legend>Buttons</legend>
                <button type="Submit">Submit</button>
                <button type="cancel">Cancel</button>
                <button type="button">Reset</button>
            </fieldset>
        </head>
<body>
    
</body>
</html>
